name: Deploy Trigger.dev

on:
  push:
    branches:
      - main
      - feat/flux-social-phase-3-8
      - feat/flux-social-phase-3-9
      - feat/maia-whatsapp-trigger-phase-4
      - feature/a2-a3-tenant-membership-permissions
    # Intentionally no path filter: Trigger tasks import shared Maia, WhatsApp,
    # tenant, billing, and orchestration modules. A path allowlist can silently
    # leave production workers on an older commit when any transitive dependency
    # changes. Keep the worker deployment aligned with every pushed commit.
  workflow_dispatch:
    inputs:
      configure_daily_schedule:
        description: "Assign and verify approved daily Instagram slots only; do not publish early"
        required: false
        default: false
        type: boolean
      prepare_review_week:
        description: "Prepare the current Fluxknight review-only weekly batch; never approve or publish"
        required: false
        default: false
        type: boolean
      repair_legacy_lead_reel:
        description: "Regenerate only the reported old lead-handoff Reel with canonical logo and narration"
        required: false
        default: false
        type: boolean
      controlled_reel_repair:
        description: "Repair only the unapproved support Reel from the reported recording"
        required: false
        default: false
        type: boolean
      controlled_carousel_test:
        description: "Run PR 399's single review-only carousel test after deployment"
        required: false
        default: false
        type: boolean
      external_deployment_id:
        description: "Optional external deployment ID for a one-time version recovery"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tenant and runtime regression contracts
        run: npm run test:support

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate Trigger.dev CI token
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::error title=Missing Trigger.dev token::Add TRIGGER_ACCESS_TOKEN as a repository secret, then rerun this workflow."
            exit 1
          fi

      - name: Deploy Trigger.dev tasks
        id: trigger_deploy
        continue-on-error: true
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_EXTERNAL_DEPLOYMENT_ID: ${{ inputs.external_deployment_id || github.sha }}
        run: |
          set -o pipefail
          npm run trigger:deploy -- --external-id "$TRIGGER_EXTERNAL_DEPLOYMENT_ID" 2>&1 | tee trigger-deploy.log

      - name: Upload Trigger.dev deploy diagnostics
        if: steps.trigger_deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trigger-deploy-diagnostics
          path: trigger-deploy.log
          if-no-files-found: error

      - name: Fail workflow when Trigger.dev deploy failed
        if: steps.trigger_deploy.outcome == 'failure'
        run: |
          echo "::error title=Trigger.dev deploy failed::See trigger-deploy-diagnostics artifact for the complete CLI output."
          exit 1

      - name: Controlled review-only Flux Social carousel verification
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_carousel_test && steps.trigger_deploy.outcome == 'success'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/verify-controlled-social-carousel.mjs

      - name: Controlled review-only support Reel repair
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_reel_repair && steps.trigger_deploy.outcome == 'success'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/verify-controlled-social-reel.mjs

      - name: Repair reported legacy lead-handoff Reel
        if: github.event_name == 'workflow_dispatch' && inputs.repair_legacy_lead_reel && steps.trigger_deploy.outcome == 'success'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/verify-legacy-lead-reel.mjs

      - name: Save private repaired legacy Reel
        if: github.event_name == 'workflow_dispatch' && inputs.repair_legacy_lead_reel && success()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-legacy-reel
          path: /tmp/corrected-legacy-reel/
          retention-days: 7

      - name: Save private corrected Reel preview
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_reel_repair && success()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-support-reel
          path: /tmp/corrected-support-reel/
          retention-days: 7

      - name: Prepare the Fluxknight review-only weekly batch
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_review_week && steps.trigger_deploy.outcome == 'success'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/prepare-social-review-week.mjs

      - name: Save private weekly review verification
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_review_week && success()
        uses: actions/upload-artifact@v4
        with:
          name: social-review-week-verification
          path: verification/social-review-week
          retention-days: 7

      - name: Verify approved daily Instagram scheduling
        if: github.event_name == 'workflow_dispatch' && inputs.configure_daily_schedule && steps.trigger_deploy.outcome == 'success'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: node scripts/verify-social-daily-schedule.mjs

      - name: Save daily Instagram schedule verification
        if: github.event_name == 'workflow_dispatch' && inputs.configure_daily_schedule && success()
        uses: actions/upload-artifact@v4
        with:
          name: social-daily-schedule-verification
          path: verification/social-daily-schedule.json
          retention-days: 30

name: Deploy Trigger.dev

on:
  push:
    branches:
      - main
      - feat/flux-social-phase-3-8
      - feat/flux-social-phase-3-9
      - feat/maia-whatsapp-trigger-phase-4
      - feature/a2-a3-tenant-membership-permissions
    paths:
      - "src/trigger/**"
      - "lib/social-learning.ts"
      - "lib/ai/maia-runtime.ts"
      - "lib/ai/maia-trigger-runtime.ts"
      - "lib/ai/limitless-realty-maia.ts"
      - "lib/whatsapp-delivery.ts"
      - "lib/system-orchestrator.ts"
      - "lib/system-event-adapters.ts"
      - "lib/ai-runtime/production-executors.ts"
      - "lib/leo-core.ts"
      - "trigger.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-trigger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Trigger.dev CI token
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::error title=Missing Trigger.dev token::Add TRIGGER_ACCESS_TOKEN as a repository secret, then rerun this workflow."
            exit 1
          fi

      - name: Deploy Trigger.dev tasks
        id: trigger_deploy
        continue-on-error: true
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          npm run trigger:deploy 2>&1 | tee trigger-deploy.log

      - name: Upload Trigger.dev deploy diagnostics
        if: steps.trigger_deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trigger-deploy-diagnostics
          path: trigger-deploy.log
          if-no-files-found: error

      - name: Fail workflow when Trigger.dev deploy failed
        if: steps.trigger_deploy.outcome == 'failure'
        run: |
          echo "::error title=Trigger.dev deploy failed::See trigger-deploy-diagnostics artifact for the complete CLI output."
          exit 1

name: Maia Draft Verification

on:
  push:
    branches:
      - draft/maia-dashboard-final-pass
  pull_request:
    branches:
      - main

jobs:
  verify-maia:
    if: github.event_name != 'pull_request' || github.head_ref != 'integration/limitless-realty-production-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -- app/api/admin/xposure/bookings/route.ts app/api/admin/xposure/payment-settings/route.ts app/dashboard/bookings/page.tsx components/admin/XposureBookingsPanel.tsx lib/human-operations.ts tests/xposure-booking-payment-lifecycle.test.mjs tests/maia-handoff-system.test.mjs
      - run: node --test tests/supabase-migration-ledger.test.mjs
      - name: Hotel communication and tenant-isolation regressions
        run: npm run test:hotel
      - name: Hotel booking and offline-verification regressions
        run: npm run test:hotel-workspace
      - name: Hotel workspace lint
        run: npx eslint app/api/portal/hotel/workspace/route.ts app/portal/hotel/page.tsx components/portal/hotel/*.tsx lib/hotel-booking-service.ts lib/hotel-booking-contract.ts tests/hotel-booking-workspace-api.test.mjs tests/hotel-booking-workspace-database.test.mjs
      - run: npm run test:maia
      - run: npm run build

  hotel-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise concurrent hotel room allocation in disposable PostgreSQL
        env:
          HOTEL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hotel_test
        run: node tests/hotel-booking-concurrency.mjs

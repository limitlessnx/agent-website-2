name: Limitless Realty safe checks

on:
  push:
    branches:
      - integration/limitless-realty-production-20261025
      - draft/limitless-realty-followups-fix-20261027
      - draft/maia-null-goal-guard-20261029
      - fix/reconcile-production-migration-ledger-20261030
  pull_request:
    branches:
      - main

concurrency:
  group: real-estate-safe-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safe-regression:
    if: github.event_name != 'pull_request' || github.head_ref == 'integration/limitless-realty-production-20261025' || github.head_ref == 'draft/limitless-realty-followups-fix-20261027' || github.head_ref == 'draft/maia-null-goal-guard-20261029' || github.head_ref == 'fix/reconcile-production-migration-ledger-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run explicitly allowlisted tenant-neutral acceptance suite
        run: node tests/run-limitless-safe-suite.mjs
      - name: TypeScript check for changed Limitless runtime modules only
        run: npx tsc --noEmit --project tsconfig.limitless-followups.json

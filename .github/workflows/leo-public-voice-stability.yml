name: Public Leo voice stability

on:
  push:
    branches:
      - fix/public-leo-evaluation-system
  workflow_dispatch:

jobs:
  voice-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild

name: Gencouv Bulk Campaign Safety
on:
  pull_request:
    paths:
      - "app/api/dashboard/gencouv/bulk-campaigns/**"
      - "app/api/gencouv/bulk-unsubscribe/**"
      - "lib/gencouv-bulk-unsubscribe.ts"
      - "components/gencouv/GencouvBulkCampaignComposer.tsx"
      - "components/gencouv/GencouvMarketingWorkspace.tsx"
      - "components/gencouv/GencouvContactImport.tsx"
      - "app/api/dashboard/gencouv/contact-consent/**"
      - "supabase/migrations/20261120040000_gencouv_resend_bulk_campaigns.sql"
      - "tests/gencouv-bulk-campaign-safety.test.mjs"
      - "tests/gencouv-bulk-campaign-database.test.mjs"
      - ".github/workflows/gencouv-bulk-campaign-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gencouv-bulk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate campaign contracts and disposable PostgreSQL reservations
        run: node --test tests/gencouv-bulk-campaign-safety.test.mjs tests/gencouv-bulk-campaign-database.test.mjs

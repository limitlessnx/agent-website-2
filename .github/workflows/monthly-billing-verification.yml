name: Monthly Billing Verification

on:
  push:
    branches:
      - fix/monthly-billing-merge-ready
      - feat/monthly-only-pricing-checkout
  pull_request:
    branches: [main]
    paths:
      - "app/api/payments/**"
      - "app/api/webhooks/flutterwave/**"
      - "app/api/admin/billing/**"
      - "lib/payments/**"
      - "lib/flux-credits.ts"
      - "lib/fluxknight-plans.ts"
      - "lib/flux-ai-metering*.ts"
      - "lib/flux-ai-operation.ts"
      - "lib/runtime/communication-outcome.ts"
      - "lib/runtime/command-queue.ts"
      - "app/api/internal/runtime/actions/outbound-email/route.ts"
      - "app/api/internal/runtime/actions/voice-receptionist/route.ts"
      - "app/api/internal/runtime/actions/dispatch/route.ts"
      - "tests/communication-outcome-*.cjs"
      - "tests/communication-dispatch-runtime.test.cjs"
      - "tests/helpers/communication-outcome-database.cjs"
      - "tests/helpers/outcome-query-adapter.cjs"
      - "tests/fixtures/communication-outcome/**"
      - "tests/flux-ai-operation.test.cjs"
      - "tests/flux-wallet-preflight.test.cjs"
      - "tests/flux-credit-visibility.test.cjs"
      - "tests/flux-credit-recovery*.cjs"
      - "tests/helpers/flux-recovery-database.cjs"
      - "tests/portal-billing-access-contract.test.mjs"
      - "app/api/portal/billing/route.ts"
      - "app/portal/billing/**"
      - "app/dashboard/billing/**"
      - "tests/flux-credit-capacity*.cjs"
      - "tests/helpers/flux-capacity-database.cjs"
      - "app/api/internal/runtime/provider/execute/route.ts"
      - "lib/payments/catalog.ts"
      - "app/onboarding/**"
      - "tests/flutterwave-billing-route-contract.test.mjs"
      - "tests/flutterwave-*.test.*"
      - "tests/fixtures/flutterwave-billing.sql"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/monthly-billing-verification.yml"
  workflow_dispatch:

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: billing_test_only
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Billing runtime and database regressions
        run: npm run test:billing
      - name: Wallet availability and provider preflight boundaries
        run: node --test tests/flux-wallet-preflight.test.cjs
      - name: Billing visibility and permission parity
        run: node --test tests/flux-credit-visibility.test.cjs tests/portal-billing-access-contract.test.mjs
      - name: Credit capacity SQL and provider lifecycle
        run: node --test tests/flux-credit-capacity-database.test.cjs tests/flux-credit-capacity-runtime.test.cjs
      - name: Recovery evidence, audit rollback and API authorization
        run: node --test tests/flux-credit-recovery-database.test.cjs tests/flux-credit-recovery-api.test.cjs
      - name: Channel operation lifecycle and billing period totals
        run: node --test tests/flux-ai-operation.test.cjs
      - name: Communication outcome and dispatch recovery
        run: npm run test:communication-outcomes
      - name: Communication outcome changed-module lint
        run: npx eslint lib/fluxknight-plans.ts lib/runtime/communication-outcome.ts lib/runtime/command-queue.ts app/api/internal/runtime/actions/outbound-email/route.ts app/api/internal/runtime/actions/voice-receptionist/route.ts app/api/internal/runtime/actions/dispatch/route.ts tests/communication-outcome-*.cjs tests/communication-dispatch-runtime.test.cjs tests/helpers/communication-outcome-database.cjs tests/helpers/outcome-query-adapter.cjs
      - name: Wallet changed-module lint
        run: npx eslint lib/flux-ai-operation.ts tests/flux-ai-operation.test.cjs lib/flux-credits.ts app/api/internal/runtime/provider/execute/route.ts tests/flux-wallet-preflight.test.cjs tests/flux-credit-visibility.test.cjs tests/flux-credit-capacity*.cjs tests/flux-credit-recovery*.cjs tests/helpers/flux-recovery-database.cjs app/api/admin/billing/reservations/route.ts app/dashboard/billing/CreditReservationRecovery.tsx app/api/portal/billing/route.ts app/portal/billing/page.tsx app/dashboard/billing/page.tsx tests/helpers/flux-capacity-database.cjs
      - name: PostgreSQL concurrent renewal sessions
        env:
          BILLING_TEST_DATABASE_URL: postgresql://postgres:billing_test_only@localhost:5432/billing_test
        run: node --test tests/flutterwave-concurrency.test.mjs
      - name: Create dedicated disposable capacity database
        env:
          PGPASSWORD: billing_test_only
        run: createdb -h localhost -p 5432 -U postgres flux_capacity_test
      - name: Independent PostgreSQL credit capacity sessions
        env:
          FLUX_CAPACITY_TEST_DATABASE_URL: postgresql://postgres:billing_test_only@localhost:5432/flux_capacity_test
        run: node --test tests/flux-credit-capacity-concurrency.test.cjs
      - name: Create dedicated disposable communication database
        env:
          PGPASSWORD: billing_test_only
        run: createdb -h localhost -p 5432 -U postgres communication_outcome_test
      - name: Independent PostgreSQL communication outcome sessions
        env:
          COMMUNICATION_OUTCOME_TEST_DATABASE_URL: postgresql://postgres:billing_test_only@localhost:5432/communication_outcome_test
        run: node --test tests/communication-outcome-concurrency.test.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
